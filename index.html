<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUPA V1.0 Full</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--bg:#000;--card:#111;--border:#333;--text:#fff;--muted:#aaa;--accent:#c0c0c0;--accent2:#fff}
body.light{--bg:#F6F7FB;--card:#fff;--border:#E2E6F0;--text:#0F1B3D;--muted:#5A6478;--accent:#FFC800;--accent2:#0F1B3D}
body.light.coral{--accent:#FF6B6B} body.light.mint{--accent:#00C896}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif} body{background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.logo{width:110px;height:110px;border-radius:28px;background:linear-gradient(145deg,#e8e8e8,#8a8a8a,#2a2a2a,#d9d9d9);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900}
.logo span{background:linear-gradient(180deg,#fff,#999);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:40px;letter-spacing:8px;margin-top:12px}.tag{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;width:100%;max-width:420px;margin-top:16px;text-align:left;box-shadow:0 4px 20px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-top:10px}
button{padding:12px;border:none;border-radius:12px;margin-top:10px;font-weight:700;cursor:pointer} .btn{width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--text)} body:not(.light) .btn{color:#111;background:linear-gradient(180deg,#fff,#c0c0c0)} .ghost{width:100%;background:transparent;color:var(--text);border:1px solid var(--border)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;border:2px solid silver;background:linear-gradient(145deg,#FFC800,#0F1B3D);color:#fff;flex-shrink:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;cursor:pointer}
.badge{background:#0f5132;color:#7CFC9A;padding:4px 10px;border-radius:20px;font-size:12px}.pill{background:var(--accent);color:var(--text);border-radius:20px;padding:8px 14px;font-weight:700;border:none;width:auto} body:not(.light) .pill{color:#111}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:50} .nav button{background:none;color:var(--muted);flex:1;padding:6px;font-size:12px} .nav button.active{color:var(--text)} .content{padding-bottom:95px}.sec{padding:14px 16px}.item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:10px} .msg{margin-top:10px;font-size:13px;color:#ff8080;min-height:18px} .ok{color:#2e9e5b!important}
.avrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .avrow button{width:48px;height:48px;border-radius:50%;font-size:20px;padding:0}
</style></head><body>
<div id="splash" class="center"><div class="logo"><span>R</span></div><h1>RUPA</h1><p class="tag">Personalisasi Tanpa Batas dengan Kreativitas Anda</p><p style="margin-top:60px;color:#888;font-size:13px">powered by. IdeA1</p></div>
<div id="authPage" class="center hidden"><div class="logo" style="width:80px;height:80px;font-size:44px"><span>R</span></div><h1 style="font-size:32px">RUPA</h1><p class="tag">Personalisasi Tanpa Batas</p><div class="card"><h2>Selamat Datang</h2><p style="color:var(--muted);font-size:13px">Login pakai akun Supabase asli</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button><button class="ghost" onclick="document.getElementById('regBox').classList.toggle('hidden')">Belum punya akun? Daftar</button><div id="regBox" class="hidden"><input id="regName" placeholder="Nama lengkap"><button class="btn" onclick="doRegister()">Daftar Akun Baru</button></div><div id="loginMsg" class="msg"></div></div><p style="margin-top:16px;color:#888;font-size:13px">powered by. IdeA1</p></div>

<div id="appPage" class="hidden"><div class="top"><div style="display:flex;gap:8px;align-items:center"><div class="logo" style="width:36px;height:36px;font-size:20px;border-radius:10px"><span>R</span></div><b style="letter-spacing:4px">RUPA</b></div><div><button onclick="toggleTheme()" style="width:auto;padding:6px 10px">🌙/☀️</button> 🔔<span style="background:red;border-radius:50%;padding:2px 6px;font-size:11px;color:#fff">3</span></div></div><div class="content" id="pageContent"></div>
<div class="nav"><button data-nav="home" class="active" onclick="go('home')">🏠<br>Home</button><button data-nav="explore" onclick="go('explore')">🔍<br>Explore</button><button data-nav="studio" onclick="go('studio')">🎨<br>My Studio</button><button data-nav="creator" onclick="go('creator')">✨<br>Creator</button><button data-nav="profile" onclick="go('profile')">👤<br>Profile</button></div></div>

<script>
let sb=null, user=null, profile=null, role='user', assets=[], favs=new Set(), saved=new Set(), curPage='home', theme='dark', accent='yellow';
function show(id){['splash','authPage','appPage'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function applyTheme(){document.body.classList.toggle('light',theme==='light');document.body.classList.remove('coral','mint');if(accent!=='yellow')document.body.classList.add(accent)}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();if(profile)saveProfile({theme_mode:theme});render()}
async function init(){ if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.includes('PASTE')){setTimeout(()=>show('authPage'),1200);document.getElementById('loginMsg').textContent='Isi config.js dulu.';return;} sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); setTimeout(async()=>{const{data:{session}}=await sb.auth.getSession(); if(session) await loadUser(session.user); else show('authPage')},1200)}
async function doLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;const m=document.getElementById('loginMsg');const{data,error}=await sb.auth.signInWithPassword({email:e,password:p}); if(error){m.textContent='Gagal: '+error.message;return;} m.textContent='Berhasil...';m.classList.add('ok'); await loadUser(data.user)}
async function doRegister(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,n=document.getElementById('regName').value.trim();const m=document.getElementById('loginMsg');const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}}); if(error){m.textContent='Gagal: '+error.message;return;} m.textContent='Akun dibuat! Silakan Login.';m.classList.add('ok')}
async function loadUser(u){user=u; const{data:p}=await sb.from('profiles').select('*').eq('id',u.id).single(); profile=p||{email:u.email,full_name:'Pengguna'}; theme=profile.theme_mode||'dark'; accent=profile.accent_color||'yellow'; applyTheme(); const{data:r}=await sb.from('user_roles').select('role').eq('user_id',u.id).single(); role=r?r.role:'user'; if(profile.is_creator) role='creator'; await loadData(); show('appPage'); go('home')}
async function loadData(){const{data:a}=await sb.from('rupa_original_assets').select('*,categories(name)').eq('status','published'); assets=a||[]; const{data:f}=await sb.from('favorites').select('asset_id').eq('user_id',user.id); favs=new Set((f||[]).map(x=>x.asset_id)); const{data:s}=await sb.from('saved_collections').select('asset_id').eq('user_id',user.id); saved=new Set((s||[]).map(x=>x.asset_id));}
async function saveProfile(patch){await sb.from('profiles').update(patch).eq('id',user.id); Object.assign(profile,patch)}
async function toggleFav(id){ if(favs.has(id)){await sb.from('favorites').delete().eq('user_id',user.id).eq('asset_id',id); favs.delete(id)} else {await sb.from('favorites').insert({user_id:user.id,asset_type:'rupa_original',asset_id:id}); favs.add(id)} render()}
async function toggleSave(id){ if(saved.has(id)){await sb.from('saved_collections').delete().eq('user_id',user.id).eq('asset_id',id); saved.delete(id)} else {await sb.from('saved_collections').insert({user_id:user.id,asset_type:'rupa_original',asset_id:id}); saved.add(id)} render()}
function assetCard(a){return `<div class="item"><b>${a.title}</b><div style="color:var(--muted);font-size:13px">${a.description||''} • ${(a.categories&&a.categories.name)||'Wallpaper'} • ${a.resolution||'3120x1440'} • ${a.compatibility||'Supported'}</div><div style="display:flex;gap:8px"><button class="pill" style="width:auto" onclick="toggleFav('${a.id}')">${favs.has(a.id)?'❤️ Favorit':'🤍 Favorite'}</button><button class="pill" style="width:auto" onclick="toggleSave('${a.id}')">${saved.has(a.id)?'✅ Tersimpan':'💾 Simpan'}</button></div></div>`}
function go(p){curPage=p; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===p)); render()}
function render(){const el=document.getElementById('pageContent'); const av=(profile.avatar_url||profile.full_name||'A').toString(); const letter=(profile.full_name||profile.email||'A').charAt(0).toUpperCase();
if(curPage==='home'){ el.innerHTML=`<div class="sec" style="display:flex;gap:12px;align-items:center"><div class="avatar">${profile.avatar_url?profile.avatar_url:letter}</div><div><div style="color:var(--muted);font-size:13px">Selamat datang kembali,</div><b style="font-size:20px">${profile.full_name||'Pengguna'}</b><div style="color:var(--muted);font-size:13px">${profile.email}</div><span class="badge">ROLE: ${role.toUpperCase()} ${profile.is_creator?'• CREATOR':''}</span></div></div>
<div class="sec"><div class="card" style="margin:0;max-width:none"><div style="display:flex;justify-content:space-between"><b>📱 Perangkat Saya</b><span class="badge">✓ Terhubung</span></div><p style="margin-top:10px"><b>Samsung Galaxy S25 Ultra</b></p><p style="color:var(--muted);font-size:13px">Android 16 • 6.8" • 3120x1440</p><button class="pill" onclick="alert('Compatibility: Wallpaper Supported, Themes Supported, Icon Packs Partially Supported')">Lihat Kompatibilitas ></button></div></div>
<div class="sec"><b>⚡ Akses Cepat</b></div><div class="grid"><div class="tile" onclick="go('explore')">🖼️<b>Wallpaper</b></div><div class="tile" onclick="go('explore')">🎨<b>Themes</b></div><div class="tile" onclick="go('explore')">🧩<b>Icon Packs</b></div><div class="tile" onclick="go('explore')">🔒<b>Lock Screen</b></div></div>
<div class="sec"><b>⭐ Koleksi Unggulan (dari Supabase)</b>${assets.filter(a=>a.is_featured).map(assetCard).join('')||'<p style="color:var(--muted)">Belum ada featured.</p>'}</div>
<div class="sec"><b>👍 Rekomendasi Untuk Anda</b>${assets.filter(a=>a.is_recommended).map(assetCard).join('')||assets.slice(0,2).map(assetCard).join('')}</div>
<div class="sec"><b>✨ Creator Spotlight</b><div class="item"><b>RUPA Creative ✓</b><div style="color:var(--muted);font-size:13px">Creator Terpilih</div><button class="pill" onclick="go('creator')">Kunjungi Profil ></button></div></div>
<div class="sec"><b>🕒 Aktivitas Saya</b><div style="color:var(--muted);font-size:13px">Favorit: ${favs.size} • Tersimpan: ${saved.size}</div></div>`}
else if(curPage==='explore'){ el.innerHTML=`<div class="sec"><h2>Explore</h2><input id="q" placeholder="Cari wallpaper, tema..." oninput="renderExplore()"><div style="display:flex;gap:8px;margin-top:10px"><button class="pill" onclick="go('explore')">Semua</button><button class="pill" onclick="alert('Filter RUPA Original aktif')">RUPA Original</button><button class="pill" onclick="alert('Filter Creator Collection aktif')">Creator</button></div><div id="expList">${assets.map(assetCard).join('')}</div></div>`; window.renderExplore=()=>{const q=(document.getElementById('q').value||'').toLowerCase(); document.getElementById('expList').innerHTML=assets.filter(a=>(a.title+' '+(a.description||'')).toLowerCase().includes(q)).map(assetCard).join('')||'<p style="color:var(--muted)">Tidak ditemukan.</p>'}}
else if(curPage==='studio'){ const myF=assets.filter(a=>favs.has(a.id)), myS=assets.filter(a=>saved.has(a.id)); el.innerHTML=`<div class="sec"><h2>My Studio</h2><p style="color:var(--muted)">Favorit & koleksi tersimpan tersinkron ke Supabase.</p><h3 style="margin-top:14px">❤️ My Favorites (${myF.length})</h3>${myF.map(assetCard).join('')||'<p style="color:var(--muted)">Belum ada favorit.</p>'}<h3 style="margin-top:14px">💾 My Collection (${myS.length})</h3>${myS.map(assetCard).join('')||'<p style="color:var(--muted)">Belum ada yang disimpan.</p>'}</div>`}
else if(curPage==='creator'){ if(!profile.is_creator){ el.innerHTML=`<div class="sec"><h2>Creator</h2><div class="card" style="max-width:none"><b>Aktifkan Creator — Open Creator</b><p style="color:var(--muted);font-size:13px">Tanpa persetujuan admin. Langsung aktif.</p><button class="btn" onclick="activateCreator()">Aktifkan Creator Sekarang</button></div></div>`} else { el.innerHTML=`<div class="sec"><h2>Creator Studio ✅ Aktif</h2><div class="item"><b>${profile.full_name}</b><div style="color:var(--muted)">${profile.creator_bio||'Creator RUPA'}</div></div><h3 style="margin-top:12px">Upload Karya</h3><input id="ct" placeholder="Judul karya"><input id="cd" placeholder="Deskripsi"><select id="cc"><option value="">Pilih kategori</option></select><button class="btn" onclick="uploadCreator()">Upload & Publish (Simpan ke Supabase)</button><div id="cmsg" class="msg"></div><h3 style="margin-top:12px">Karya Saya</h3><div id="myCreator"></div></div>`; loadCreatorWorks(); loadCats(); } }
else if(curPage==='profile'){ el.innerHTML=`<div class="sec" style="text-align:center"><div class="avatar" style="width:120px;height:120px;font-size:48px;margin:0 auto">${profile.avatar_url?profile.avatar_url:letter}</div><div style="margin-top:12px"><button class="pill" onclick="showAvatarPicker()">📷 Ganti Foto</button> <button class="pill" onclick="showEditProfile()">✏️ Edit Profil</button></div><div id="profileExtra"></div><h3 style="margin-top:16px">${profile.full_name}</h3><p style="color:var(--muted)">${profile.email} • ROLE: ${role.toUpperCase()}</p><p style="color:var(--muted);font-size:13px">${profile.bio||''}</p></div>
<div class="sec"><h3>Preferensi Tampilan</h3><div class="item">Mode: <button class="pill" onclick="toggleTheme()">${theme==='dark'?'🌙 Gelap — Ganti ke Terang':'☀️ Terang — Ganti ke Gelap'}</button><div style="margin-top:10px">Aksen Light Mode: <button class="pill" onclick="setAccent('yellow')">Kuning Navy</button> <button class="pill" onclick="setAccent('coral')">Coral</button> <button class="pill" onclick="setAccent('mint')">Mint</button></div></div><div class="item">Email: ${profile.email}<br>Kota: ${profile.city||'-'}<br>HP: ${profile.phone||'-'}</div><button class="ghost" onclick="doLogout()">Logout</button>${role==='admin'?'<button class="btn" onclick="goAdmin()">Masuk Admin Dashboard</button>':''}</div>`}
else if(curPage==='admin'){ el.innerHTML=`<div class="sec"><h2>Admin Dashboard</h2><p style="color:var(--muted)">Kelola RUPA Original — data langsung ke Supabase.</p><input id="at" placeholder="Judul koleksi baru"><input id="ad" placeholder="Deskripsi"><button class="btn" onclick="addAsset()">+ Tambah Koleksi (Published)</button><div id="amsg" class="msg"></div><h3 style="margin-top:14px">Daftar Koleksi</h3>${assets.map(a=>`<div class="item"><b>${a.title}</b> — ${a.status} <button class="pill" onclick="delAsset('${a.id}')">Hapus</button> <button class="pill" onclick="togglePub('${a.id}','${a.status}')">Publish/Unpublish</button></div>`).join('')}</div>`}
}
async function setAccent(a){accent=a; applyTheme(); await saveProfile({accent_color:a}); render()}
async function activateCreator(){ await sb.from('creator_profiles').upsert({user_id:user.id,display_name:profile.full_name,username:(profile.email||'').split('@')[0],bio:'Creator RUPA'}); await saveProfile({is_creator:true}); profile.is_creator=true; alert('Creator aktif!'); render()}
async function loadCats(){const{data}=await sb.from('categories').select('*'); const s=document.getElementById('cc'); if(s&&data) s.innerHTML='<option value="">Pilih kategori</option>'+data.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
async function loadCreatorWorks(){const{data}=await sb.from('creator_assets').select('*').eq('creator_id',user.id); const el=document.getElementById('myCreator'); if(el) el.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.title}</b> — ${x.status} <button class="pill" onclick="delCreator('${x.id}')">Hapus</button></div>`).join('')||'<p style="color:var(--muted)">Belum ada karya.</p>'}
async function uploadCreator(){const t=document.getElementById('ct').value, d=document.getElementById('cd').value, c=document.getElementById('cc').value; if(!t){alert('Isi judul dulu');return;} const{error}=await sb.from('creator_assets').insert({creator_id:user.id,title:t,description:d,category_id:c||null,status:'published',tags:[]}); document.getElementById('cmsg').textContent=error?'Gagal: '+error.message:'Berhasil upload & publish!'; loadCreatorWorks()}
async function delCreator(id){await sb.from('creator_assets').delete().eq('id',id); loadCreatorWorks()}
function showAvatarPicker(){const el=document.getElementById('profileExtra'); el.innerHTML=`<div class="item"><b>Pilih Avatar</b><div class="avrow">${['😀','😎','👩','👨','🦊','🐉','⭐','🎨'].map(e=>`<button onclick="pickAvatar('${e}')">${e}</button>`).join('')}</div><p style="font-size:12px;color:var(--muted)">Upload galeri aktif di versi Supabase Storage berikutnya.</p></div>`}
async function pickAvatar(e){await saveProfile({avatar_url:e}); profile.avatar_url=e; render(); alert('Foto profil diubah!')}
function showEditProfile(){const el=document.getElementById('profileExtra'); el.innerHTML=`<div class="item"><input id="en" value="${profile.full_name||''}" placeholder="Nama"><input id="eb" value="${profile.bio||''}" placeholder="Bio"><input id="ec" value="${profile.city||''}" placeholder="Kota"><input id="ep" value="${profile.phone||''}" placeholder="HP"><button class="btn" onclick="saveEditProfile()">Simpan</button></div>`}
async function saveEditProfile(){await saveProfile({full_name:document.getElementById('en').value,bio:document.getElementById('eb').value,city:document.getElementById('ec').value,phone:document.getElementById('ep').value}); profile.full_name=document.getElementById('en').value; render(); alert('Profil disimpan!')}
async function addAsset(){const t=document.getElementById('at').value, d=document.getElementById('ad').value; if(!t){alert('Isi judul');return;} const{data:cats}=await sb.from('categories').select('id').limit(1); const{error}=await sb.from('rupa_original_assets').insert({title:t,description:d,category_id:cats[0].id,status:'published',is_featured:false}); document.getElementById('amsg').textContent=error?'Gagal: '+error.message:'Berhasil ditambah!'; await loadData(); render()}
async function delAsset(id){await sb.from('rupa_original_assets').delete().eq('id',id); await loadData(); render()}
async function togglePub(id,st){await sb.from('rupa_original_assets').update({status:st==='published'?'draft':'published'}).eq('id',id); await loadData(); render()}
function goAdmin(){curPage='admin'; render()}
async function doLogout(){await sb.auth.signOut(); show('authPage')}
init();
</script></body></html>
