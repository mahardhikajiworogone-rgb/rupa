<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUPA V1.0 Full Premium</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RUPA"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#000;color:#fff;min-height:100vh;background-image:radial-gradient(600px 300px at 50% -50px,rgba(255,255,255,.18),transparent 60%),radial-gradient(500px 400px at 80% 30%,rgba(192,192,192,.12),transparent 60%),radial-gradient(400px 300px at 10% 60%,rgba(255,255,255,.08),transparent 60%)}
body.light{background:#F6F7FB;color:#0F1B3D;background-image:none}
body.light.coral{--accent:#FF6B6B} body.light.mint{--accent:#00C896}
.hidden{display:none!important}.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.logo{width:110px;height:110px;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.3)} .logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo-img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:40px;letter-spacing:8px;margin-top:12px}.tag{color:#aaa} body.light .tag{color:#5A6478}
.card{background:#111;border:1px solid #333;border-radius:20px;padding:18px;width:100%;max-width:420px;margin-top:16px;text-align:left} body.light .card{background:#fff;border-color:#E2E6F0}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;margin-top:10px} body.light input,body.light select{background:#fff;color:#0F1B3D;border-color:#E2E6F0}
button{padding:12px;border:none;border-radius:12px;margin-top:10px;font-weight:700;cursor:pointer}.btn{width:100%;background:linear-gradient(180deg,#fff,#c0c0c0);color:#111} body.light .btn{background:#FFC800;color:#0F1B3D}
.ghost{width:100%;background:transparent;color:#fff;border:1px solid #333} body.light .ghost{color:#0F1B3D;border-color:#E2E6F0}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.top-left{display:flex;gap:10px;align-items:center}.burger{font-size:26px;line-height:1}.rupa-logo{font-size:38px;font-weight:900;background:linear-gradient(180deg,#fff,#777);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.rupa-text{font-size:26px;letter-spacing:3px;font-weight:800;background:linear-gradient(180deg,#fff,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bell{position:relative;font-size:22px}.bell i{position:absolute;top:-6px;right:-8px;background:#e11d48;color:#fff;font-size:10px;font-style:normal;border-radius:50%;padding:2px 5px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block} .avatar{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;border:2px solid silver;background:linear-gradient(145deg,#FFC800,#0F1B3D);color:#fff;flex-shrink:0}
.device-card{background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:1px solid #555;border-radius:20px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.5)} body.light .device-card{background:#fff;border-color:#E2E6F0;box-shadow:0 8px 24px rgba(15,27,61,.08)}
.phone-mock{position:relative;width:78px;height:110px;flex-shrink:0}.phone-back{position:absolute;left:0;top:6px;width:48px;height:96px;border-radius:12px;background:linear-gradient(160deg,#c0c0c0,#555);border:1px solid #888}.phone-front{position:absolute;right:0;top:0;width:46px;height:102px;border-radius:12px;background:linear-gradient(180deg,#7b2ff7,#2f7bff,#ff7b9c);border:2px solid #111;overflow:hidden}.phone-front::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),transparent 50%)}.phone-glow{position:absolute;left:-6px;right:-6px;bottom:-8px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.5),transparent 70%)}
.badge{background:#0f5132;color:#7CFC9A;padding:5px 10px;border-radius:20px;font-size:12px}.pill{background:linear-gradient(180deg,#fff,#c0c0c0);color:#111;border-radius:20px;padding:8px 14px;font-weight:700;border:none;width:auto} body.light .pill{background:#FFC800;color:#0F1B3D}
.sec{padding:14px 16px}.sec-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px}.sec-head span{font-weight:800;font-size:17px}.sec-head a{color:#aaa;font-size:13px}
.quick4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:0 16px}.qcard{background:linear-gradient(180deg,#171717,#0a0a0a);border:1px solid #3a3a3a;border-radius:16px;padding:14px 6px;text-align:center;cursor:pointer} body.light .qcard{background:#fff;border-color:#E2E6F0}.qicon{font-size:32px;color:#fff} body.light .qicon{color:#0F1B3D}.qcard b{display:block;margin-top:8px;font-size:13px}.qcard span{display:block;color:#aaa;font-size:10px;margin-top:2px} body.light .qcard span{color:#5A6478}
.feat2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.feat{border-radius:16px;padding:16px;min-height:130px;display:flex;justify-content:space-between;align-items:flex-end;border:1px solid #444;position:relative;overflow:hidden}.feat1{background:linear-gradient(135deg,#e8e8e8,#777 40%,#111 70%,#999)} .feat2b{background:linear-gradient(135deg,#111,#444 40%,#888 70%,#111)}.feat b{display:block;color:#fff;text-shadow:0 1px 6px #000}.feat span{font-size:12px;color:#ddd}.circle-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid #fff;font-size:16px;padding:0}
.reco{margin:0 16px;border-radius:16px;padding:20px;background:linear-gradient(120deg,#111,#333 30%,#999 60%,#111);border:1px solid #444;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;min-height:130px} body.light .reco{background:linear-gradient(120deg,#0F1B3D,#2a4a9f,#FFC800)}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;border:1px solid #fff;display:block}.dots i.on{background:#fff}
.spot{margin:0 16px;background:linear-gradient(180deg,#1a1a1a,#0a0a0a);border:1px solid #444;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px} body.light .spot{background:#fff;border-color:#E2E6F0}.spot-logo{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid silver} .spot-logo img{width:100%;height:100%;object-fit:cover;display:block}
.act-row{display:flex;gap:10px;padding:0 16px;overflow-x:auto}.act{flex:0 0 120px;height:80px;border-radius:14px;border:1px solid #444}.act1{background:linear-gradient(135deg,#333,#999)} .act2{background:linear-gradient(135deg,#ff9a7a,#2f4a9f)} .act3{background:linear-gradient(135deg,#222,#555)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;border-top:1px solid #333;display:flex;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:50} body.light .nav{background:#fff;border-color:#E2E6F0}.nav button{background:none;color:#888;flex:1;padding:6px;font-size:12px} .nav button.active{color:#fff} body.light .nav button.active{color:#0F1B3D}.content{padding-bottom:95px}.item{background:#111;border:1px solid #333;border-radius:14px;padding:12px;margin-top:10px} body.light .item{background:#fff;border-color:#E2E6F0}.msg{margin-top:10px;font-size:13px;color:#ff8080;min-height:18px}.ok{color:#2e9e5b!important}.avrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.avrow button{width:48px;height:48px;border-radius:50%;font-size:20px;padding:0}
</style></head><body>

<script>
let sb=null, user=null, profile=null, role='user', assets=[], favs=new Set(), saved=new Set(), curPage='home', theme='dark', accent='yellow';
function show(id){['splash','authPage','appPage'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function applyTheme(){document.body.classList.toggle('light',theme==='light');document.body.classList.remove('coral','mint');if(accent!=='yellow')document.body.classList.add(accent)}
function toggleTheme(){theme=theme==='dark'?'light':'dark';applyTheme();if(profile)saveProfile({theme_mode:theme});render()}
async function init(){ setTimeout(()=>{ try{ if(document.getElementById('splash') && !document.getElementById('splash').classList.contains('hidden')) show('authPage'); }catch(e){} }, 4000); if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.includes('PASTE')){setTimeout(()=>show('authPage'),1200);document.getElementById('loginMsg').textContent='Isi config.js dulu.';return;} sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); setTimeout(async()=>{const{data:{session}}=await sb.auth.getSession(); if(session) await loadUser(session.user); else show('authPage')},1200)}
async function doLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;const m=document.getElementById('loginMsg');const{data,error}=await sb.auth.signInWithPassword({email:e,password:p}); if(error){m.textContent='Gagal: '+error.message;return;} m.textContent='Berhasil...';m.classList.add('ok'); await loadUser(data.user)}
async function doRegister(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,n=document.getElementById('regName').value.trim();const m=document.getElementById('loginMsg');const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}}); if(error){m.textContent='Gagal: '+error.message;return;} m.textContent='Akun dibuat! Silakan Login.';m.classList.add('ok')}
async function loadUser(u){user=u; const{data:p}=await sb.from('profiles').select('*').eq('id',u.id).single(); profile=p||{email:u.email,full_name:'Pengguna'}; theme=profile.theme_mode||'dark'; accent=profile.accent_color||'yellow'; applyTheme(); const{data:r}=await sb.from('user_roles').select('role').eq('user_id',u.id).single(); role=r?r.role:'user'; /* admin tetap admin walau sudah jadi creator */ await loadData(); show('appPage'); go('home')}
async function loadData(){const{data:a}=await sb.from('rupa_original_assets').select('*,categories(name)').eq('status','published'); assets=a||[];
  try{ const{data:ca}=await sb.from('creator_assets').select('*').eq('status','published'); (ca||[]).forEach(c=>{ assets.push({id:c.id,title:c.title,description:(c.description||'')+' • Creator',categories:c.categories,status:c.status,is_featured:false,is_recommended:false,resolution:'3120x1440',compatibility:'Supported'}); }); }catch(e){} const{data:f}=await sb.from('favorites').select('asset_id').eq('user_id',user.id); favs=new Set((f||[]).map(x=>x.asset_id)); const{data:s}=await sb.from('saved_collections').select('asset_id').eq('user_id',user.id); saved=new Set((s||[]).map(x=>x.asset_id));}
async function saveProfile(patch){await sb.from('profiles').update(patch).eq('id',user.id); Object.assign(profile,patch)}
async function toggleFav(id){ if(favs.has(id)){await sb.from('favorites').delete().eq('user_id',user.id).eq('asset_id',id); favs.delete(id)} else {await sb.from('favorites').insert({user_id:user.id,asset_type:'rupa_original',asset_id:id}); favs.add(id)} render()}
async function toggleSave(id){ if(saved.has(id)){await sb.from('saved_collections').delete().eq('user_id',user.id).eq('asset_id',id); saved.delete(id)} else {await sb.from('saved_collections').insert({user_id:user.id,asset_type:'rupa_original',asset_id:id}); saved.add(id)} render()}
function assetCard(a){return `<div class="item"><b>${a.title}</b><div style="color:var(--muted);font-size:13px">${a.description||''} • ${(a.categories&&a.categories.name)||'Wallpaper'} • ${a.resolution||'3120x1440'} • ${a.compatibility||'Supported'}</div><div style="display:flex;gap:8px"><button class="pill" style="width:auto" onclick="toggleFav('${a.id}')">${favs.has(a.id)?'❤️ Favorit':'🤍 Favorite'}</button><button class="pill" style="width:auto" onclick="toggleSave('${a.id}')">${saved.has(a.id)?'✅ Tersimpan':'💾 Simpan'}</button></div></div>`}
function go(p){curPage=p; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===p)); render()}
function render(){const el=document.getElementById('pageContent'); const av=(profile.avatar_url||profile.full_name||'A').toString(); const letter=(profile.full_name||profile.email||'A').charAt(0).toUpperCase();
if(curPage==='home'){ el.innerHTML=`<div class="sec" style="display:flex;gap:12px;align-items:center"><div class="avatar" onclick="go('profile')" style="cursor:pointer">${(profile.avatar_url&&profile.avatar_url.length>4)?`<img src="${profile.avatar_url}">`:letter}</div><div><div style="color:var(--muted);font-size:13px">Selamat datang kembali,</div><b style="font-size:22px">${profile.full_name||'Pengguna'}</b><div style="color:var(--muted);font-size:13px">Temukan tampilan baru untuk smartphone Anda.</div><span class="badge">ROLE: ${role.toUpperCase()}</span></div></div>

else if(curPage==='explore'){ el.innerHTML=`<div class="sec"><h2>Explore</h2><input id="q" placeholder="Cari wallpaper, tema..." oninput="renderExplore()"><div style="display:flex;gap:8px;margin-top:10px"><button class="pill" onclick="go('explore')">Semua</button><button class="pill" onclick="alert('Filter RUPA Original aktif')">RUPA Original</button><button class="pill" onclick="alert('Filter Creator Collection aktif')">Creator</button></div><div id="expList">${assets.map(assetCard).join('')}</div></div>`; window.renderExplore=()=>{const q=(document.getElementById('q').value||'').toLowerCase(); document.getElementById('expList').innerHTML=assets.filter(a=>(a.title+' '+(a.description||'')).toLowerCase().includes(q)).map(assetCard).join('')||'<p style="color:var(--muted)">Tidak ditemukan.</p>'}}
else if(curPage==='studio'){ const myF=assets.filter(a=>favs.has(a.id)), myS=assets.filter(a=>saved.has(a.id)); el.innerHTML=`<div class="sec"><h2>My Studio</h2><p style="color:var(--muted)">Favorit & koleksi tersimpan tersinkron ke Supabase.</p><h3 style="margin-top:14px">❤️ My Favorites (${myF.length})</h3>${myF.map(assetCard).join('')||'<p style="color:var(--muted)">Belum ada favorit.</p>'}<h3 style="margin-top:14px">💾 My Collection (${myS.length})</h3>${myS.map(assetCard).join('')||'<p style="color:var(--muted)">Belum ada yang disimpan.</p>'}</div>`}
else if(curPage==='creator'){ if(!profile.is_creator){ el.innerHTML=`<div class="sec"><h2>Creator</h2><div class="card" style="max-width:none"><b>Aktifkan Creator — Open Creator</b><p style="color:var(--muted);font-size:13px">Tanpa persetujuan admin. Langsung aktif.</p><button class="btn" onclick="activateCreator()">Aktifkan Creator Sekarang</button></div></div>`} else { el.innerHTML=`<div class="sec"><h2>Creator Studio ✅ Aktif</h2><div class="item"><b>${profile.full_name}</b><div style="color:var(--muted)">${profile.creator_bio||'Creator RUPA'}</div></div><h3 style="margin-top:12px">Upload Karya</h3><input id="ct" placeholder="Judul karya"><input id="cd" placeholder="Deskripsi"><select id="cc"><option value="">Pilih kategori</option></select><button class="btn" onclick="uploadCreator()">Upload & Publish (Simpan ke Supabase)</button><div id="cmsg" class="msg"></div><h3 style="margin-top:12px">Karya Saya</h3><div id="myCreator"></div></div>`; loadCreatorWorks(); loadCats(); } }
else if(curPage==='profile'){ el.innerHTML=`<div class="sec" style="text-align:center"><div class="avatar" style="width:120px;height:120px;font-size:48px;margin:0 auto">${(profile.avatar_url&&profile.avatar_url.length>4)?`<img src="${profile.avatar_url}">`:letter}</div><input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="uploadAvatarFile(this)"><div style="margin-top:10px"><button class="pill" onclick="document.getElementById('avatarFile').click()">📷 Ambil dari Galeri HP</button> <button class="pill" onclick="removeAvatar()">🗑️ Hapus Foto</button></div><div id="avatarMsg" class="msg"></div><div style="margin-top:12px"><button class="pill" onclick="showAvatarPicker()">📷 Ganti Foto</button> <button class="pill" onclick="showEditProfile()">✏️ Edit Profil</button></div><div id="profileExtra"></div><h3 style="margin-top:16px">${profile.full_name}</h3><p style="color:var(--muted)">${profile.email} • ROLE: ${role.toUpperCase()}</p><p style="color:var(--muted);font-size:13px">${profile.bio||''}</p></div>
<div class="sec"><h3>Preferensi Tampilan</h3><div class="item">Mode: <button class="pill" onclick="toggleTheme()">${theme==='dark'?'🌙 Gelap — Ganti ke Terang':'☀️ Terang — Ganti ke Gelap'}</button><div style="margin-top:10px">Aksen Light Mode: <button class="pill" onclick="setAccent('yellow')">Kuning Navy</button> <button class="pill" onclick="setAccent('coral')">Coral</button> <button class="pill" onclick="setAccent('mint')">Mint</button></div></div><div class="item">Email: ${profile.email}<br>Kota: ${profile.city||'-'}<br>HP: ${profile.phone||'-'}</div><button class="ghost" onclick="doLogout()">Logout</button>${role==='admin'?'<button class="btn" onclick="goAdmin()">Masuk Admin Dashboard</button>':''}</div>`}
else if(curPage==='admin'){ el.innerHTML=`<div class="sec"><h2>Admin Dashboard</h2><p style="color:var(--muted)">Kelola RUPA Original — data langsung ke Supabase.</p><input id="at" placeholder="Judul koleksi baru"><input id="ad" placeholder="Deskripsi"><button class="btn" onclick="addAsset()">+ Tambah Koleksi (Published)</button><div id="amsg" class="msg"></div><h3 style="margin-top:14px">Daftar Koleksi</h3>${assets.map(a=>`<div class="item"><b>${a.title}</b> — ${a.status} <button class="pill" onclick="delAsset('${a.id}')">Hapus</button> <button class="pill" onclick="togglePub('${a.id}','${a.status}')">Publish/Unpublish</button></div>`).join('')}</div>`}
}
async function setAccent(a){accent=a; applyTheme(); await saveProfile({accent_color:a}); render()}
async function activateCreator(){ await sb.from('creator_profiles').upsert({user_id:user.id,display_name:profile.full_name,username:(profile.email||'').split('@')[0],bio:'Creator RUPA'}); await saveProfile({is_creator:true}); profile.is_creator=true; alert('Creator aktif!'); render()}
async function loadCats(){const{data}=await sb.from('categories').select('*'); const s=document.getElementById('cc'); if(s&&data) s.innerHTML='<option value="">Pilih kategori</option>'+data.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
async function loadCreatorWorks(){const{data}=await sb.from('creator_assets').select('*').eq('creator_id',user.id); const el=document.getElementById('myCreator'); if(el) el.innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.title}</b> — ${x.status} <button class="pill" onclick="delCreator('${x.id}')">Hapus</button></div>`).join('')||'<p style="color:var(--muted)">Belum ada karya.</p>'}
async function uploadCreator(){const t=document.getElementById('ct').value, d=document.getElementById('cd').value, c=document.getElementById('cc').value; if(!t){alert('Isi judul dulu');return;} const{error}=await sb.from('creator_assets').insert({creator_id:user.id,title:t,description:d,category_id:c||null,status:'published',tags:[]}); document.getElementById('cmsg').textContent=error?'Gagal: '+error.message:'Berhasil upload & publish!'; loadCreatorWorks()}
async function delCreator(id){await sb.from('creator_assets').delete().eq('id',id); loadCreatorWorks()}
function showAvatarPicker(){const el=document.getElementById('profileExtra'); el.innerHTML=`<div class="item"><b>Foto Profil dari Galeri</b><p style=\"font-size:13px;color:var(--muted)\">Pilih foto asli dari galeri HP kamu. Foto akan di-upload ke Supabase Storage & tersimpan di profil.</p><input type=\"file\" id=\"avatarFile2\" accept=\"image/*\" onchange=\"uploadAvatarFile(this)\"><button class=\"btn\" onclick=\"document.getElementById('avatarFile2').click()\">📷 Pilih dari Galeri</button><div id=\"avatarMsg2\" class=\"msg\"></div><b style=\"display:block;margin-top:14px\">Atau Pilih Avatar</b><div class="avrow">${['😀','😎','👩','👨','🦊','🐉','⭐','🎨'].map(e=>`<button onclick="pickAvatar('${e}')">${e}</button>`).join('')}</div><p style="font-size:12px;color:var(--muted)">Upload galeri aktif di versi Supabase Storage berikutnya.</p></div>`}
async function uploadAvatarFile(input){ const f=input.files&&input.files[0]; if(!f) return; const msg=document.getElementById('avatarMsg')||document.getElementById('avatarMsg2'); if(msg) msg.textContent='Mengupload foto...'; try{
    // compress via canvas
    const dataUrl=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
    const img=new Image(); img.src=dataUrl; await new Promise(r=>img.onload=r);
    const canvas=document.createElement('canvas'); const max=600; let w=img.width,h=img.height; if(w>max){h=h*max/w; w=max;} canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.85));
    const path=user.id+'/'+Date.now()+'.jpg';
    const {error:upErr}=await sb.storage.from('avatars').upload(path, blob, {upsert:true, contentType:'image/jpeg'});
    if(upErr) throw upErr;
    const {data:pub}=sb.storage.from('avatars').getPublicUrl(path);
    await saveProfile({avatar_url: pub.publicUrl}); profile.avatar_url=pub.publicUrl;
    if(msg) msg.textContent='Foto profil berhasil diubah!'; render(); alert('Foto profil berhasil diubah dari galeri!');
  }catch(e){ if(msg) msg.textContent='Upload ke Storage gagal: '+e.message+' — menampilkan foto lokal sementara.'; /* fallback: show local preview */ try{ const r=new FileReader(); r.onload=async()=>{ profile.avatar_url=r.result; render(); }; r.readAsDataURL(f);}catch(_){} } }
async function removeAvatar(){ await saveProfile({avatar_url: null}); profile.avatar_url=null; render(); alert('Foto profil dihapus.'); }
async function pickAvatar(e){await saveProfile({avatar_url:e}); profile.avatar_url=e; render(); alert('Foto profil diubah!')}
function showEditProfile(){const el=document.getElementById('profileExtra'); el.innerHTML=`<div class="item"><input id="en" value="${profile.full_name||''}" placeholder="Nama"><input id="eb" value="${profile.bio||''}" placeholder="Bio"><input id="ec" value="${profile.city||''}" placeholder="Kota"><input id="ep" value="${profile.phone||''}" placeholder="HP"><button class="btn" onclick="saveEditProfile()">Simpan</button></div>`}
async function saveEditProfile(){await saveProfile({full_name:document.getElementById('en').value,bio:document.getElementById('eb').value,city:document.getElementById('ec').value,phone:document.getElementById('ep').value}); profile.full_name=document.getElementById('en').value; render(); alert('Profil disimpan!')}
async function addAsset(){const t=document.getElementById('at').value, d=document.getElementById('ad').value; if(!t){alert('Isi judul');return;} const{data:cats}=await sb.from('categories').select('id').limit(1); const{error}=await sb.from('rupa_original_assets').insert({title:t,description:d,category_id:cats[0].id,status:'published',is_featured:false}); document.getElementById('amsg').textContent=error?'Gagal: '+error.message:'Berhasil ditambah!'; await loadData(); render()}
async function delAsset(id){await sb.from('rupa_original_assets').delete().eq('id',id); await loadData(); render()}
async function togglePub(id,st){await sb.from('rupa_original_assets').update({status:st==='published'?'draft':'published'}).eq('id',id); await loadData(); render()}
function goAdmin(){curPage='admin'; render()}
async function doLogout(){await sb.auth.signOut(); show('authPage')}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); } init();
</script></body></html>
